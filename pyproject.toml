[project]
name = "proseometry"
version = "0.1.0"
description = "Language-model evaluation for what perplexity misses: long-context use, degeneration, distributional realism, and a combined Prose Quality Index."
readme = "README.md"
authors = [
    { name = "Demonstrandum", email = "moi@knutsen.co" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]
keywords = ["language-models", "evaluation", "perplexity", "long-context", "mauve", "degeneration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# Adapters for PyTorch modules and Hugging Face checkpoints.
torch = [
    "torch>=2.0",
    "transformers>=4.40",
]
# MAUVE (Pillutla et al. 2021) via the reference implementation.
mauve = [
    "mauve-text>=0.4",
]
all = [
    "proseometry[torch,mauve]",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs network access (downloads a tiny Hugging Face checkpoint)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
